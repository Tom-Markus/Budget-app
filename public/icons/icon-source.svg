<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Tom's Cabinet — App Icon</title>
  <defs>
    <radialGradient id="profondeur" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A2D52" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#08152A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B16A"/>
      <stop offset="55%" stop-color="#B8954A"/>
      <stop offset="100%" stop-color="#8E6F2F"/>
    </linearGradient>
  </defs>
  <!-- Fond bleu nuit + dégradé de profondeur -->
  <rect width="100" height="100" fill="#0E1F3A"/>
  <rect width="100" height="100" fill="url(#profondeur)"/>
  <!-- Liseré or fin en bas (signature) -->
  <rect x="0" y="98.4" width="100" height="0.6" fill="#B8954A" opacity="0.5"/>
  <!-- Sceau : anneau or + filet intérieur -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#or-app)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="36.5" fill="none" stroke="#D4B16A" stroke-width="0.75" opacity="0.5"/>
  <!-- T serif vectorisé or, optiquement centré -->
  <path d="M30 34 L70 34 L70 43 L66 43 L66 39 L54 39 L54 64 L61 64 L61 69 L39 69 L39 64 L46 64 L46 39 L34 39 L34 43 L30 43 Z"
        fill="url(#or-app)" transform="translate(0 -1.5)"/>
</svg>
